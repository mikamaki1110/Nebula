<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="512" height="512">
  <title>ATLAS</title>
  <style>
    .star { transform-box: fill-box; transform-origin: center; animation: pulse 3.2s 1.6s ease-in-out infinite, fade .5s .95s both; }
    @keyframes pulse { 50% { transform: scale(1.35); } }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .ring { stroke-dasharray: 186; stroke-dashoffset: 186; animation: draw 1.1s ease-out forwards; }
    .aa { stroke-dasharray: 100; stroke-dashoffset: 100; animation: draw .9s .15s cubic-bezier(.3,.7,.2,1) forwards; }
    .orb { animation: fade .6s .75s both; }
    .moon { animation: fade .5s 1s both; }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1d212a"/><stop offset="1" stop-color="#0a0c10"/></linearGradient>
    <radialGradient id="glow" cx="50%" cy="60%" r="62%"><stop offset="0" stop-color="#f06a2a" stop-opacity="0.24"/><stop offset="1" stop-color="#f06a2a" stop-opacity="0"/></radialGradient>
    <linearGradient id="fa" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#f06a2a"/><stop offset="1" stop-color="#ffd25a"/></linearGradient>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.6"/></filter>
    <filter id="soft" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur in="SourceGraphic" stdDeviation="0.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <rect width="64" height="64" rx="14" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="63" height="63" rx="13.5" fill="none" stroke="#ffffff" stroke-opacity="0.12"/>
  <g transform="translate(6.4 6.4) scale(0.8)">
    <circle class="ring" cx="32" cy="32" r="29.5" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1.2"/>
    <g transform="rotate(-14 32 40)"><path class="orb" d="M10 40 A22 7.5 0 0 1 54 40" fill="none" stroke="#ffd25a" stroke-opacity="0.35" stroke-width="1.6" stroke-linecap="round"/></g>
    <path d="M13 52 L32 10 L51 52" fill="none" stroke="url(#fa)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0.45" filter="url(#blur)"/>
    <path class="aa" d="M13 52 L32 10 L51 52" fill="none" stroke="url(#fa)" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="rotate(-14 32 40)">
      <path class="orb" d="M54 40 A22 7.5 0 0 1 10 40" fill="none" stroke="#ffd25a" stroke-width="1.6" stroke-linecap="round"/>
      <g class="moon"><circle r="2.7" fill="#ffd9b0" filter="url(#soft)"><animateMotion dur="8s" repeatCount="indefinite" path="M10 40 A22 7.5 0 0 1 54 40 A22 7.5 0 0 1 10 40"/><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0.4;0.4;1;1" keyTimes="0;0.5;0.5;1"/></circle></g>
    </g>
    <circle class="star" cx="32" cy="10" r="3.3" fill="#ffd9b0" filter="url(#soft)"/>
  </g>
</svg>
