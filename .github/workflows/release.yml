# Baut Nebula auf einem Windows-Server von GitHub und veröffentlicht
# "Nebula-Setup-<version>.exe" als öffentliches Release.
#
# Starten: Repository → Actions → "Nebula veröffentlichen" → "Run workflow"
# Neue Version: vorher "version" in package.json erhöhen (z. B. 1.4.0 → 1.5.0)
name: Nebula veröffentlichen

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Code holen
        uses: actions/checkout@v5

      - name: Node.js einrichten
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Pakete installieren
        run: npm install --no-audit --no-fund

      - name: Sensor-Dienst (LibreHardwareMonitor + PawnIO) einpacken
        shell: pwsh
        run: ./build/fetch-sensors.ps1

      - name: Setup-EXE bauen und als Release veröffentlichen
        run: >-
          npx electron-builder --win --publish always
          --config.publish.provider=github
          --config.publish.owner=${{ github.repository_owner }}
          --config.publish.repo=${{ github.event.repository.name }}
          --config.publish.releaseType=release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: EXE zusätzlich als Download im Actions-Lauf ablegen
        uses: actions/upload-artifact@v4
        with:
          name: Nebula-Windows
          path: dist/*.exe
